# Put a Yandex Music card in your GitHub profile README.
#
# 1. Copy this file to .github/workflows/music.yml in your profile repository
#    (the one named after your username).
# 2. Put your own playlist link in `playlist` below. The link the share button
#    gives you carries everything — no login, no token, nothing to look up.
#    The older /users/<login>/playlists/<kind> shape works too, but then you
#    also need `user`, because the kind is only a number inside one account.
# 3. Add the image to your README:
#
#        ![music](./music.svg)

name: music

on:
  schedule:
    - cron: "0 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: abdurahmon27/yamu@v1
        with:
          playlist: "https://music.yandex.uz/playlists/ch.448df3eb-daee-408a-a60a-252259db2f3b"
          limit: "6"
          out: "music.json"
          card: "music.svg"
          theme: "gruvbox"
          cover: "true"

      - name: commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.json music.svg
          git diff --staged --quiet || git commit -m "chore: refresh music"
          git push
